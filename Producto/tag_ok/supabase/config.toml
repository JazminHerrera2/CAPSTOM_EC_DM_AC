project_id = "auvgnsvzcrszguerorot"

# El gateway de Supabase solo entiende JWT propios de Supabase. Aquí el
# Authorization lleva el ID Token de Firebase, así que la función lo verifica
# ella misma contra las claves públicas de Google (ver index.ts).
[functions.secure-document-upload]
verify_jwt = false

# Mismo caso: ia-extraccion verifica el ID Token de Firebase por su cuenta.
[functions.ia-extraccion]
verify_jwt = false
